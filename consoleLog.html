<!DOCTYPE html>
<html lang="en">
<head>
    <title>Console Log Example</title>
</head>
<body>
    <script>
        
        var postX = 7;
        console.log(postX++);       
        console.log(postX);
        var preY=6;
        console.log(++preY);
        console.log(preY);
        var num = 20;
        var str = "20";
        console.log("Loose Equality (==):", num == str); 
        console.log("Strict Equality (===):", num === str); 
    </script>

</body>
</html>
