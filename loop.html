<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops in JavaScript</title>
</head>
<body>
    <script>
        for(let i=1;i<=10;i++){
            console.log("For Loop Iteration:", i);
        }

        const students = ["John", "Sara", "Mike", "Emma", "Alex"];

        for (let i = 0; i < students.length; i++) {
            console.log(students[i]);
        }

        const marks = [85, 92, 78, 90, 88];
        let total = 0;
        let i = 0;
        do {
            total += marks[i];
            i++;
        } while (i < marks.length);
        console.log("Individual Marks:", marks);
        console.log("Total Marks Obtained:", total);

        const number = 5;
        console.log(`Multiplication Table of ${number}:`);
        for (let i = 1; i <= 10; i++) {
            console.log(`${number} x ${i} = ${number * i}`);
        }

        let n = 1;
        console.log("Even numbers from 1 to 10:");
        do {
            if (n % 2 === 0) {
                console.log(n);
            }
            n++;
        } while (n <= 10);

        console.log("Odd numbers from 1 to 10:");
        for (let m = 1; m <= 10; m += 2) {
            console.log(m);
        }

        const correctPin = "1234";
        const attempts = ["9999", "1234"]; 
        for (let i = 0; i < 3; i++) {
            console.log("Entered:", attempts[i]);
  
            if (attempts[i] === correctPin) {
            console.log("Success! Access granted.");
            break;
            }
            console.log("Wrong PIN.");
        }

        const passwords = ["123", "secret1234"];

        for (let i = 0; i < passwords.length; i++) {
            if (passwords[i].length >= 8) {
            console.log(passwords[i] + ": Valid");
            } else {
                console.log(passwords[i] + ": Too Short");
            }
        }
    </script>
</body>
</html>
