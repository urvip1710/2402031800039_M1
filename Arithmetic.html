<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arithmetic Operators</title>
</head>
<body></body>
    <script>
        
        var a = 10;
        var b = 3;
  
        console.log( a + b);

        console.log( a - b);

        console.log( a * b); 
     
        console.log( a / b); 
       
        console.log("Modulus (Remainder of 10 / 3):", a % b); 

        console.log("Exponentiation (10 to the power of 3):", a ** b); 

        var inc = 5;
        inc++; 
        console.log("Incremented Value:", inc); 

        var dec = 5;
        dec--; 
        console.log("Decremented Value:", dec); 
    </script>

</body>
</html>
