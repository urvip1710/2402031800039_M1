<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body bgcolor="pink">
        <form>
            <label for=" First name"> First Name:</label>
            <input type="text" id=" First name" name="First name" placeholder="Enter first name"><br><br>

            <label for=" Last name"> Last Name:</label>
            <input type="text" id=" Last name" name="Last name" placeholder="Enter last name"><br><br> 

            <label for="Contact no.">Contact no.:</label>
            <input type="number" id="Contact no." name="Contact no." placeholder="Enter your contact no."><br><br>

            <label for="Landline no.">Landline no.:</label>
            <input type="number" id="Landline no." name="Landline no." placeholder="Enter your landline no."><br><br>

            <label for="Email">Email:</label>
            <input type="email" id="Email" name="Email" placeholder="Enter your email"><br><br>

            <label for="Password">Password:</label>
            <input type="Password" id="Password" name="Password" placeholder="Enter your password"><br><br>

            <label for="DOB">Date of Birth:</label>
            <input type="date" id="DOB" name="DOB"><br><br>

            <label for="Age">Age:</label>
            <input type="number" id="Age" name="Age" placeholder="Enter your age"><br><br>

            <label for="Gender">Gender:</label>
            <input type="text" id="Gender" name="Gender" placeholder="Enter your gender"><br><br>
           
            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" placeholder="Enter your address"><br><br>

            <label for="City">City:</label>
            <input type="text" id="City" name="City" placeholder="Enter your city"><br><br>

            <label for="Pincode">Pincode:</label>
            <input type="number" id="Pincode" name="Pincode" placeholder="Enter your pincode"><br><br>

            <label for="Joining Date">Joining Date:</label>
            <input type="date" id="Joining Date" name="Joining Date"><br><br>

            <label for="Confirm your form">Confirm your form:</label>
            <input type="checkbox" id="Confirm your Form" name="Confirm your Form"><br><br>

            <input type="submit" value="Submit">  <input type="Reset" value="Reset"
        </form>
    </body>
</head>
</html>
